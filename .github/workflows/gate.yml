name: gate
on: [push, pull_request]
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }                  # the herd check finds the commit that sealed its claims
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: unit + hostile-input (never-throw) suites, and the live page's own gate
        run: node --test test/*.test.mjs

      - name: the red-team battery re-runs and must reproduce its receipt byte-for-byte
        run: node attack-kit/redteam.mjs --check

      - name: the mesh over LIGHT — a forgery refused at node 0 is dropped on sight by the peers it was shared to
        run: |
          node tools/light-share.mjs
          node -e "const f=require('./receipts/light-share.json').facts; const ok = f.k1.node0!=='admitted' && f.k1.node1==='recognised' && f.k1.node2==='recognised' && f.k1.sentLight>=1 && f.k2.unpinned.status===403 && f.k2.tampered.status===403 && f.k2.decodedAfter===f.k2.decodedBefore && f.k3.batch.ratio>=2; if(!ok){console.error('LIGHT mesh check failed',JSON.stringify(f)); process.exit(1)} console.log('LIGHT mesh: node0',f.k1.node0,'→ peers recognised; batch',f.k3.batch.ratio+'x smaller than JSON')"

      - name: the Liveware Pilot's receipt re-checked (ledger and books re-derived from the feed, the judge re-run, a real node on 3,000 records)
        run: node pilot/check.mjs

      - name: the herd — a planted zero-day lands once, then every node patches itself from the evidence; five real nodes re-run, the seven sealed claims re-judged (timings aside)
        run: node herd/measure.mjs --check
      - name: the tarpit - a confirmed attacker held, genuine traffic never; a real node and a tarpit-off twin re-run, the eight sealed claims re-judged (timings aside)
        run: node tarpit/measure.mjs --check
      - name: the tarpit p-7b - what the tarpit node learned equals its twin, every field but the time and the chain fields that commit to it
        run: node tarpit/twins-7b.mjs --check

      - name: mutation + fuzz gate over every decision kernel (no unreviewed survivors); its receipt must come out byte-for-byte the same
        run: node witness-all.mjs --receipt && git diff --exit-code -- receipts/witness.json

      - name: the vaccines — every attack ever journalled, replayed through the gate (if present)
        run: node tools/vaccinate.mjs --check || echo "no vaccine file yet — skipping"

      - name: break-it as a node of the shared foundation — the adapter's mutation gate (witness v0.6, in one process under the OS timeout)
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness6
          node /tmp/witness6/witness.mjs mutate node/breakit-node.mjs --timeout 120000 --cap 400 --test timeout -k 5 90 node test/breakit-node.test.mjs | tee /tmp/wn.txt
          grep -q '"clean": true' /tmp/wn.txt || { echo "::error::mutants survived in node/breakit-node.mjs"; exit 1; }
